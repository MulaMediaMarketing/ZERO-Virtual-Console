name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Verify persistence ACK failure handling
        shell: pwsh
        timeout-minutes: 2
        run: ./build/Release/ZeroIpcPersistenceAcceptance.exe

      - name: Build ZERO reference package
        shell: pwsh
        run: ./sample_game/reference/build-reference-package.ps1 -ReferenceExe ./build/Release/ZeroReferenceGame.exe -Output ./build/ReferencePackage

      - name: Verify launch-time package integrity
        shell: pwsh
        timeout-minutes: 3
        run: ./build/Release/ZeroPackageIntegrityAcceptance.exe ./build/ReferencePackage

      - name: Verify package trust architecture
        shell: pwsh
        timeout-minutes: 2
        run: ./build/Release/ZeroPackageTrustAcceptance.exe

      - name: Verify installed package repair flow
        shell: pwsh
        timeout-minutes: 3
        run: ./build/Release/ZeroPackageRepairAcceptance.exe

      - name: Verify ZERO input finalization
        shell: pwsh
        timeout-minutes: 2
        run: ./build/Release/ZeroInputAcceptance.exe

      - name: Verify installer update uninstall V2
        shell: pwsh
        timeout-minutes: 3
        run: ./tools/verify-installer-v2.ps1 -BuildRoot ./build

      - name: Verify Runtime V4.1 RC payload
        shell: pwsh
        run: ./tools/verify-rc-build.ps1 -BuildRoot ./build

      - name: Upload ZERO binaries
        uses: actions/upload-artifact@v4
        with:
          name: ZERO-Virtual-Console-Windows-x64
          path: |
            build/Release/ZeroVirtualConsole.exe
            build/Release/ZeroTestGame.exe
            build/Release/ZeroReferenceGame.exe
            build/Release/ZeroAcceptance.exe
            build/Release/ZeroIpcPersistenceAcceptance.exe
            build/Release/ZeroPackageIntegrityAcceptance.exe
            build/Release/ZeroPackageTrustAcceptance.exe
            build/Release/ZeroPackageRepairAcceptance.exe
            build/Release/ZeroInputAcceptance.exe
            build/ReferencePackage/**
            tools/verify-rc-build.ps1
            tools/verify-installer-v2.ps1
            docs/RUNTIME_V4_1_RC_GATE.md
            installer/install-zero.ps1
            installer/uninstall-zero.ps1
