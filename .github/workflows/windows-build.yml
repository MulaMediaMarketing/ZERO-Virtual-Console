name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Validate strict JSON hostile-input contract
        shell: pwsh
        run: ./build/Release/ZeroStrictJsonAcceptance.exe

      - name: Validate canonical platform database contract
        shell: pwsh
        run: ./build/Release/ZeroPlatformDatabaseAcceptance.exe

      - name: Validate local storage fault injection
        shell: pwsh
        run: ./build/Release/ZeroFaultInjectionAcceptance.exe

      - name: Validate production core performance budgets
        shell: pwsh
        run: ./build/Release/ZeroProductionBenchmarkAcceptance.exe

      - name: Validate dependency surface
        shell: pwsh
        run: ./tools/verify-dependency-surface.ps1 -ReportDir ./build/DependencyReports

      - name: Validate production architecture and collect benchmarks
        shell: pwsh
        run: ./tools/verify-production-architecture.ps1 -BuildRoot ./build -ReportDir ./build/ArchitectureReports

      - name: Validate production closure ownership
        shell: pwsh
        run: ./tools/verify-production-closure.ps1 -SourceRoot .

      - name: Validate release governance and supply-chain controls
        shell: pwsh
        run: ./tools/verify-release-governance.ps1 -SourceRoot . -ReportDir ./build/GovernanceReports

      - name: Validate server-authority fail-closed contract
        shell: pwsh
        run: ./build/Release/ZeroServerAuthorityAcceptance.exe

      - name: Validate all ZERO Core Architecture V5 migrations
        shell: pwsh
        run: ./tools/run-v5-acceptance.ps1 -BuildRoot ./build

      - name: Validate final V5 runtime cutover
        shell: pwsh
        run: ./tools/verify-v5-cutover.ps1 -SourceRoot . -ReportDir ./build/V5CutoverReports

      - name: Validate production shell navigation contract
        shell: pwsh
        run: ./build/Release/ZeroProductionUxAcceptance.exe

      - name: Validate Friends experience contract
        shell: pwsh
        run: ./build/Release/ZeroFriendsExperienceAcceptance.exe

      - name: Validate Captures experience contract
        shell: pwsh
        run: ./build/Release/ZeroCapturesExperienceAcceptance.exe

      - name: Validate Home Library and Game Detail contract
        shell: pwsh
        run: ./build/Release/ZeroCoreShellExperienceAcceptance.exe

      - name: Validate Store Settings and First Boot contract
        shell: pwsh
        run: ./build/Release/ZeroStoreSettingsFirstBootAcceptance.exe

      - name: Validate persisted First Boot recovery
        shell: pwsh
        run: ./build/Release/ZeroFirstBootPersistenceAcceptance.exe

      - name: Build ZERO reference package
        shell: pwsh
        run: ./sample_game/reference/build-reference-package.ps1 -ReferenceExe ./build/Release/ZeroReferenceGame.exe -Output ./build/ReferencePackage

      - name: Run full automated M1 acceptance
        shell: pwsh
        timeout-minutes: 12
        run: ./tools/verify-m1-automated.ps1 -BuildRoot ./build -ReportDir ./build/AcceptanceReports

      - name: Validate RC qualification remains physical-hardware gated
        shell: pwsh
        timeout-minutes: 2
        run: ./tools/run-rc-qualification.ps1 -BuildRoot ./build -EvidenceDir ./build/QualificationEvidence -NonInteractiveValidation

      - name: Generate SPDX SBOM
        shell: pwsh
        run: ./tools/generate-sbom.ps1 -BuildRoot ./build -OutputPath ./build/SBOM/zero-virtual-console.spdx.json

      - name: Build deterministic RC release bundle
        shell: pwsh
        run: ./tools/package-release.ps1 -BuildRoot ./build -OutputDir ./build/ReleaseBundle

      - name: Upload ZERO binaries and acceptance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ZERO-Virtual-Console-Windows-x64
          if-no-files-found: error
          path: |
            build/Release/ZeroVirtualConsole.exe
            build/Release/ZeroTestGame.exe
            build/Release/ZeroReferenceGame.exe
            build/Release/ZeroAcceptance.exe
            build/Release/ZeroIpcPersistenceAcceptance.exe
            build/Release/ZeroPackageIntegrityAcceptance.exe
            build/Release/ZeroPackageTrustAcceptance.exe
            build/Release/ZeroPackageRepairAcceptance.exe
            build/Release/ZeroStrictJsonAcceptance.exe
            build/Release/ZeroPlatformDatabaseAcceptance.exe
            build/Release/ZeroFaultInjectionAcceptance.exe
            build/Release/ZeroProductionBenchmarkAcceptance.exe
            build/Release/ZeroInputAcceptance.exe
            build/Release/ZeroShellUxAcceptance.exe
            build/Release/ZeroProductionUxAcceptance.exe
            build/Release/ZeroFriendsExperienceAcceptance.exe
            build/Release/ZeroCapturesExperienceAcceptance.exe
            build/Release/ZeroCoreShellExperienceAcceptance.exe
            build/Release/ZeroStoreSettingsFirstBootAcceptance.exe
            build/Release/ZeroFirstBootPersistenceAcceptance.exe
            build/Release/ZeroServerAuthorityAcceptance.exe
            build/Release/ZeroV5*Acceptance.exe
            build/Release/ZeroV5RuntimeChild.exe
            build/Release/ZeroQualificationProbe.exe
            build/ReferencePackage/**
            build/DependencyReports/**
            build/ArchitectureReports/**
            build/GovernanceReports/**
            build/V5CutoverReports/**
            build/AcceptanceReports/**
            build/QualificationEvidence/**
            build/SBOM/**
            build/ReleaseBundle/**
            build/ZERO-Virtual-Console-Windows-x64-RC.zip
            tools/run-v5-acceptance.ps1
            tools/verify-v5-cutover.ps1
            tools/verify-production-closure.ps1
            tools/verify-dependency-surface.ps1
            tools/verify-production-architecture.ps1
            tools/verify-release-governance.ps1
            tools/verify-m1-automated.ps1
            tools/run-rc-qualification.ps1
            tools/verify-rc-build.ps1
            tools/verify-installer-v2.ps1
            tools/generate-sbom.ps1
            tools/verify-authenticode.ps1
            tools/package-release.ps1
            tools/package-production-release.ps1
            docs/PRODUCTION_ARCHITECTURE_STANDARD.md
            docs/SERVER_AUTHORITY_SECURITY.md
            docs/RUNTIME_V4_1_RC_GATE.md
            docs/ZERO_CORE_ARCHITECTURE_V5.md
            SECURITY.md
            .github/CODEOWNERS
            installer/install-zero.ps1
            installer/uninstall-zero.ps1
