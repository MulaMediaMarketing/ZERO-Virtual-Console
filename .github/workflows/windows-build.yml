name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Validate production shell navigation contract
        shell: pwsh
        run: ./build/Release/ZeroProductionUxAcceptance.exe

      - name: Validate Friends experience contract
        shell: pwsh
        run: ./build/Release/ZeroFriendsExperienceAcceptance.exe

      - name: Validate Captures experience contract
        shell: pwsh
        run: ./build/Release/ZeroCapturesExperienceAcceptance.exe

      - name: Validate Home Library and Game Detail contract
        shell: pwsh
        run: ./build/Release/ZeroCoreShellExperienceAcceptance.exe

      - name: Validate Store Settings and First Boot contract
        shell: pwsh
        run: ./build/Release/ZeroStoreSettingsFirstBootAcceptance.exe

      - name: Build ZERO reference package
        shell: pwsh
        run: ./sample_game/reference/build-reference-package.ps1 -ReferenceExe ./build/Release/ZeroReferenceGame.exe -Output ./build/ReferencePackage

      - name: Run full automated M1 acceptance
        shell: pwsh
        timeout-minutes: 12
        run: ./tools/verify-m1-automated.ps1 -BuildRoot ./build -ReportDir ./build/AcceptanceReports

      - name: Validate RC qualification remains physical-hardware gated
        shell: pwsh
        timeout-minutes: 2
        run: ./tools/run-rc-qualification.ps1 -BuildRoot ./build -EvidenceDir ./build/QualificationEvidence -NonInteractiveValidation

      - name: Build deterministic RC release bundle
        shell: pwsh
        run: ./tools/package-release.ps1 -BuildRoot ./build -OutputDir ./build/ReleaseBundle

      - name: Upload ZERO binaries and acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: ZERO-Virtual-Console-Windows-x64
          path: |
            build/Release/ZeroVirtualConsole.exe
            build/Release/ZeroTestGame.exe
            build/Release/ZeroReferenceGame.exe
            build/Release/ZeroAcceptance.exe
            build/Release/ZeroIpcPersistenceAcceptance.exe
            build/Release/ZeroPackageIntegrityAcceptance.exe
            build/Release/ZeroPackageTrustAcceptance.exe
            build/Release/ZeroPackageRepairAcceptance.exe
            build/Release/ZeroInputAcceptance.exe
            build/Release/ZeroShellUxAcceptance.exe
            build/Release/ZeroProductionUxAcceptance.exe
            build/Release/ZeroFriendsExperienceAcceptance.exe
            build/Release/ZeroCapturesExperienceAcceptance.exe
            build/Release/ZeroCoreShellExperienceAcceptance.exe
            build/Release/ZeroStoreSettingsFirstBootAcceptance.exe
            build/Release/ZeroQualificationProbe.exe
            build/ReferencePackage/**
            build/AcceptanceReports/**
            build/QualificationEvidence/**
            build/ReleaseBundle/**
            build/ZERO-Virtual-Console-Windows-x64-RC.zip
            tools/verify-m1-automated.ps1
            tools/run-rc-qualification.ps1
            tools/verify-rc-build.ps1
            tools/verify-installer-v2.ps1
            tools/package-release.ps1
            docs/RUNTIME_V4_1_RC_GATE.md
            installer/install-zero.ps1
            installer/uninstall-zero.ps1
